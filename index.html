<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة تعلملي الذكية - 3allemly AI</title>
    <style>
        :root {
            --bg-dark: #090d16;
            --card-bg: #151c2c;
            --accent-blue: #0284c7;
            --accent-green: #10b981;
            --text-main: #f1f5f9;
            --text-sub: #94a3b8;
            --border-color: #1e293b;
        }

        * { box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; margin: 0; padding: 0; }
        body { background-color: var(--bg-dark); color: var(--text-main); font-size: 15px; min-height: 100vh; }

        /* الهيدر والملاحة */
        header { background: var(--card-bg); padding: 15px 30px; display: flex; align-items: center; justify-content: space-between; border-bottom: 2px solid var(--border-color); }
        .logo-box { display: flex; align-items: center; gap: 10px; }
        .logo-badge { background: linear-gradient(135deg, #0284c7, #38bdf8); color: white; padding: 6px 14px; border-radius: 8px; font-weight: bold; font-size: 18px; }
        .logo-title { font-size: 20px; font-weight: bold; color: #38bdf8; }

        nav { display: flex; gap: 8px; }
        nav button { background: transparent; border: 1px solid transparent; color: var(--text-sub); padding: 8px 16px; border-radius: 8px; cursor: pointer; font-weight: 600; transition: 0.2s; }
        nav button.active, nav button:hover { background: var(--accent-blue); color: white; }

        /* حاوية المحتوى */
        .main-container { max-width: 900px; margin: 30px auto; padding: 0 15px; }
        .view-section { display: none; }
        .view-section.active { display: block; }

        /* الكروت */
        .card { background: var(--card-bg); padding: 25px; border-radius: 14px; border: 1px solid var(--border-color); margin-bottom: 20px; box-shadow: 0 8px 24px rgba(0,0,0,0.4); }
        .card-header { font-size: 18px; color: #38bdf8; margin-bottom: 15px; padding-bottom: 8px; border-bottom: 1px solid var(--border-color); }

        /* المدخلات */
        .field-group { margin-bottom: 15px; }
        label { display: block; font-weight: 600; margin-bottom: 6px; color: var(--text-sub); }
        input, select { width: 100%; padding: 12px 14px; background: #0b1120; border: 1px solid var(--border-color); border-radius: 8px; color: white; font-size: 14px; outline: none; }
        input:focus, select:focus { border-color: var(--accent-blue); }

        /* منطقة رفع الملف */
        .drop-zone { border: 2px dashed var(--accent-blue); border-radius: 12px; padding: 35px; text-align: center; background: #0b1120; cursor: pointer; transition: 0.3s; margin-top: 15px; }
        .drop-zone:hover { background: #111a2e; }

        /* الأزرار */
        .btn-action { display: block; width: 100%; padding: 13px; background: var(--accent-blue); color: white; border: none; border-radius: 8px; font-weight: bold; font-size: 15px; cursor: pointer; transition: 0.2s; text-align: center; }
        .btn-action:hover { opacity: 0.9; }
        .btn-green { background: var(--accent-green); }
        .btn-whatsapp { background: #25d366; color: white; flex: 1; }

        /* شاشة التحميل والنتائج */
        .status-loader { display: none; text-align: center; margin: 20px 0; }
        .spinner { width: 40px; height: 40px; border: 4px solid var(--border-color); border-top-color: var(--accent-blue); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 10px; }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        .result-card { display: none; background: #0d2818; border: 1px solid var(--accent-green); border-radius: 10px; padding: 20px; margin-top: 20px; }
        .flex-buttons { display: flex; gap: 10px; margin-top: 15px; }
