<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3allemly AI - منصة التعليم الذكي</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; margin: 0; padding: 0; }
        body { background-color: #0f172a; color: #f8fafc; font-size: 15px; padding-bottom: 50px; }
        header { background: #1e293b; padding: 15px 30px; display: flex; align-items: center; justify-content: space-between; border-bottom: 2px solid #334155; position: sticky; top: 0; z-index: 100; }
        .logo-container { display: flex; align-items: center; gap: 12px; }
        .logo-avatar { width: 45px; height: 45px; background: #0284c7; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 20px; color: white; }
        .logo-container h1 { font-size: 22px; color: #38bdf8; }
        nav { display: flex; gap: 10px; }
        nav button { background: transparent; border: 1px solid transparent; color: #94a3b8; padding: 10px 18px; border-radius: 8px; cursor: pointer; font-size: 15px; font-weight: 600; transition: 0.3s; }
        nav button.active, nav button:hover { background: #0284c7; color: #fff; border-color: #38bdf8; }
        .container { max-width: 950px; margin: 30px auto; padding: 0 20px; }
        .page { display: none; }
        .page.active { display: block; }
        .card { background: #1e293b; padding: 25px; border-radius: 12px; border: 1px solid #334155; margin-bottom: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.3); }
        h2 { color: #38bdf8; margin-bottom: 15px; font-size: 18px; border-bottom: 1px solid #334155; padding-bottom: 8px; }
        label { display: block; margin-top: 14px; margin-bottom: 6px; color: #cbd5e1; font-weight: bold; }
        input, select { width: 100%; padding: 12px; border: 1px solid #334155; border-radius: 8px; background: #0f172a; color: #fff; font-size: 15px; outline: none; }
        .file-upload-box { border: 2px dashed #0284c7; border-radius: 10px; padding: 35px; text-align: center; background: #0f172a; cursor: pointer; margin-top: 15px; }
        .btn { display: inline-block; width: 100%; padding: 14px; background: #0284c7; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 20px; text-align: center; }
        .btn-success { background: #16a34a; }
        .btn-whatsapp { background: #25d366; color: #fff; width: 49%; padding: 12px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; }
        .loader { display: none; margin: 25px 0; text-align: center; }
        .spinner { width: 45px; height: 45px; border: 4px solid #334155; border-top: 4px solid #38bdf8; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 15px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .result-box { display: none; background: #0f172a; border: 1px solid #22c55e; border-radius: 10px; padding: 20px; margin-top: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { padding: 12px; text-align: center; border-bottom: 1px solid #334155; }
        th { background: #0f172a; color: #38bdf8; }
    </style>
</head>
<body>
    <header>
        <div class="logo-container">
            <div class="logo-avatar">3A</div>
            <h1>منصة 3allemly AI</h1>
        </div>
        <nav>
            <button class="active" onclick="switchPage('home', event)">الرئيسية</button>
            <button onclick="switchPage('upload', event)">رفع الواجب والتصحيح</button>
            <button onclick="switchPage('grades', event)">درجاتي (My Grades)</button>
        </nav>
    </header>

    <div class="container">
        <!-- الصفحة الرئيسية -->
        <div id="page-home" class="page active">
            <div class="card">
                <h2>تسجيل دخول الطالب</h2>
