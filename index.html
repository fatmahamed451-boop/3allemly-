<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3allemly AI - منصة التعليم الذكي</title>
    <!-- ربط ملف التنسيق الخارجي -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- شريط التنقل العلوي -->
    <header>
        <div class="logo-container">
            <div class="logo-avatar">3A</div>
            <h1>منصة 3allemly AI</h1>
        </div>
        <nav>
            <button class="nav-btn active" data-page="page-home">الرئيسية</button>
            <button class="nav-btn" data-page="page-upload">رفع الواجب والتصحيح</button>
            <button class="nav-btn" data-page="page-grades">درجاتي (My Grades)</button>
        </nav>
    </header>

    <div class="container">
        <!-- 1. الصفحة الرئيسية -->
        <section id="page-home" class="page active">
            <div class="card">
                <h2>بيانات الطالب والتسجيل</h2>
                <div class="form-group">
                    <label>كود / ID الطالب:</label>
                    <input type="text" id="student-id" placeholder="أدخل كود الطالب">
                </div>
                <div class="form-group">
                    <label>رقم واتساب الطالب:</label>
                    <input type="tel" id="student-phone" placeholder="201xxxxxxxxx">
                </div>
                <div class="form-group">
                    <label>رقم واتساب ولي الأمر:</label>
                    <input type="tel" id="parent-phone" placeholder="201xxxxxxxxx">
                </div>
            </div>

            <div class="card">
                <h2>اختيار المعلم والمادة</h2>
                <div class="form-group">
                    <label>اختر المعلم المفضّل:</label>
                    <select id="teacher-select">
                        <option value="">-- اختر المدرس --</option>
                        <option value="مستر وليد أحمد (رياضيات)">مستر وليد أحمد - رياضيات</option>
                        <option value="مستر محمود صهيب (فيزياء)">مستر محمود صهيب - فيزياء</option>
                        <option value="مستر عبد الله غنم (إنجليزي)">مستر عبد الله غنم - إنجليزي</option>
                        <option value="مستر عمرو طه (إنجليزي)">مستر عمرو طه - إنجليزي</option>
                        <option value="مستر محمود محمد (فرنساوي)">مستر محمود محمد - فرنساوي</option>
                    </select>
                </div>
                <button class="btn btn-primary" id="btn-to-upload">الانتقال لرفع الواجب 🚀</button>
            </div>
        </section>

        <!-- 2. صفحة رفع الواجب -->
        <section id="page-upload" class="page">
            <div class="card">
                <h2>رفع الواجب للتصحيح بالذكاء الاصطناعي</h2>
                <div class="form-group">
                    <label>تاريخ التسليم (Due Date):</label>
                    <input type="date" id="due-date">
                </div>

                <div class="file-upload-box" id="drop-zone">
                    <p id="file-label">📄 اضغط هنا أو اسحب ملف الواجب (PDF أو صورة)</p>
                    <input type="file" id="file-input" style="display:none">
                </div>

                <button class="btn btn-success" id="btn-start-grading">🚀 بدء تصحيح 3allemly AI</button>

                <!-- انيميشن التحميل والذكاء الاصطناعي -->
                <div class="loader" id="loader">
                    <div class="spinner"></div>
                    <p>جاري تحليل الواجب وتصحيحه �
